<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📖 My Private Diary</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1e1e2f;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #27293d;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 600px;
    }
    h1 { margin-top: 0; font-size: 24px; text-align: center; }
    input[type="password"], textarea {
      width: 100%;
      padding: 12px;
      background: #1d1d28;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
      margin-bottom: 15px;
      font-size: 15px;
    }
    textarea { height: 180px; resize: vertical; }
    button {
      width: 100%;
      padding: 12px;
      background: #00d2d3;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: #1e1e2f;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }
    button:hover { background: #01a3a4; }
    .hidden { display: none; }
    .error { color: #ff6b6b; font-size: 14px; margin-top: -10px; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="card">
  <h1>📖 My Private Diary</h1>

  <!-- Password Unlock View -->
  <div id="login-view">
    <label for="pass-input">Enter diary master password:</label>
    <input type="password" id="pass-input" placeholder="Password" />
    <div id="error-msg" class="error hidden">Incorrect password or corrupted data.</div>
    <button onclick="unlockDiary()">Unlock Diary</button>
  </div>

  <!-- Diary Editor / Reader View -->
  <div id="editor-view" class="hidden">
    <textarea id="diary-text" placeholder="Write your diary thoughts here..."></textarea>
    <button onclick="saveAndExport()">Save & Copy Encrypted String</button>
    <p style="font-size: 12px; color: #888; margin-top: 10px;">
      * Clicking save will copy your new encrypted string to clipboard. Paste it into the <code>ENCRYPTED_DATA</code> variable in this file and push to GitHub.
    </p>
  </div>
</div>

<script>
  // 1. PLACE YOUR ENCRYPTED CIPHERTEXT HERE
  // If left empty (""), the page lets you set a brand-new initial entry.
  const ENCRYPTED_DATA = ""; 

  let activePassword = "";

  async function getKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function unlockDiary() {
    const password = document.getElementById("pass-input").value;
    const errorDiv = document.getElementById("error-msg");
    errorDiv.classList.add("hidden");

    if (!password) return;

    if (!ENCRYPTED_DATA) {
      // First time setup: no encrypted data yet
      activePassword = password;
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("editor-view").classList.remove("hidden");
      return;
    }

    try {
      const combined = Uint8Array.from(atob(ENCRYPTED_DATA), c => c.charCodeAt(0));
      const salt = combined.slice(0, 16);
      const iv = combined.slice(16, 28);
      const data = combined.slice(28);

      const key = await getKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);

      document.getElementById("diary-text").value = new TextDecoder().decode(decrypted);
      activePassword = password;
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("editor-view").classList.remove("hidden");
    } catch (e) {
      errorDiv.classList.remove("hidden");
    }
  }

  async function saveAndExport() {
    const content = document.getElementById("diary-text").value;
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));

    const key = await getKey(activePassword, salt);
    const encrypted = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv: iv },
      key,
      new TextEncoder().encode(content)
    );

    const fullBuffer = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
    fullBuffer.set(salt, 0);
    fullBuffer.set(iv, salt.length);
    fullBuffer.set(new Uint8Array(encrypted), salt.length + iv.length);

    const base64Cipher = btoa(String.fromCharCode(...fullBuffer));

    navigator.clipboard.writeText(base64Cipher);
    alert("Encrypted data copied to clipboard! Paste this value inside const ENCRYPTED_DATA = '...' in your index.html.");
  }
</script>
</body>
</html>
